# Compilation (vérification de types comprise) et tests à chaque push sur main
# et à chaque pull request. Testé sur la version minimale prise en charge
# (engines) et sur celle du .nvmrc.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : la CI n'a rien à écrire dans le dépôt.
permissions:
  contents: read

# Un nouveau push annule la vérification encore en cours sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '26']
    steps:
      # Figées par empreinte : un tag d'action peut être déplacé, pas un commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Le jeton GitHub n'a pas à rester accessible aux scripts npm.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Aucune dépendance n'a besoin de script d'installation : autant les interdire.
      - run: npm ci --ignore-scripts
      - run: npm test
