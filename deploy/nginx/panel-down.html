<meta name="robots" content="noindex, nofollow">

<title>Panel indisponible</title>
<style>

  main { max-width: 26rem; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; line-height: 1.25; }
  p { margin: 0 0 8px; color: var(--muted); }
</style>
</head>
<body>
<main>
