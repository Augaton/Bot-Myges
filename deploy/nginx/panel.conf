# Panel étudiant : https://<adresse du serveur>:8443
#
# nginx apporte le HTTPS et la page « indisponible ». Le panel tourne avec le bot, dans
# Pelican. Une allocation créée sur 127.0.0.1 écoute en réalité sur l'interface Docker
# (172.18.0.1 par défaut) : c'est cette adresse qu'il faut viser, jamais 127.0.0.1.
# Pour la connaître : sudo docker ps --format '{{.Ports}}' | grep 8788
# Remplace 203.0.113.10 et, si besoin, le dossier du certificat (voir DEPLOY.md).

limit_req_zone $binary_remote_addr zone=myges_login:10m rate=30r/m;

server {
    # La forme sur la ligne listen est comprise par toutes les versions de nginx.
    listen 8443 ssl http2;
    server_name 203.0.113.10;

    ssl_certificate     /etc/letsencrypt-ip/live/203.0.113.10/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-ip/live/203.0.113.10/privkey.pem;

    # $http_host et non $host : il garde le port, requis par le contrôle d'origine.
    proxy_set_header Host $http_host;
    # Remplace ce qu'enverrait le client : il ne peut pas choisir son adresse.
    proxy_set_header X-Forwarded-For $remote_addr;
    # Les documents des étudiants ne passent pas par le disque de nginx.
    proxy_max_temp_file_size 0;
    client_max_body_size 8k;

    # Panel arrêté : page statique. Les réponses du panel lui-même ne sont pas touchées.
    error_page 502 504 =503 /panel-down.html;
    location = /panel-down.html {
        root /var/www/panel-myges;
        internal;
    }

    location = /api/login {
        limit_req zone=myges_login burst=30 nodelay;
        proxy_pass http://172.18.0.1:8788;
    }
    location / {
        proxy_pass http://172.18.0.1:8788;
    }
}
